# ============================================================================
#  Análisis automático, una hora antes de cada oleada de partidos
# ----------------------------------------------------------------------------
#  El cron dispara cada 30 min durante la ventana de béisbol, pero casi siempre
#  termina en el primer paso sin gastar nada: el portero (bot/toca-correr.mjs)
#  usa solo la API de MLB, que es gratis, para decidir si toca.
#
#  Solo cuando falta ~1 hora para el primer juego de una oleada se abre el
#  navegador y se corre el análisis de verdad (~183 créditos de The Odds API con 15 juegos).
#  Con eso salen unas 4-5 corridas al día, ~11,000 créditos al mes contra una
#  cuota de 20,000.
#
#  SECRETOS QUE HAY QUE CREAR en Settings > Secrets and variables > Actions:
#    BOT_EMAIL     correo de la cuenta de Supabase DEDICADA al robot
#    BOT_PASSWORD  su contraseña
#  No uses tu cuenta personal: crea una aparte solo para esto. Ver bot/LEEME.md
# ============================================================================
name: Análisis automático

on:
  schedule:
    # Cada 30 min de 15:00 a 03:00 UTC = 11:00 am a 11:00 pm hora del Este.
    #
    # MINUTOS 7 Y 37, NO 0 Y 30, A PROPÓSITO. GitHub avisa en su documentación que
    # los disparos programados se retrasan o se PIERDEN cuando hay carga alta, y la
    # carga se concentra en punto y a y media porque ahí los pone todo el mundo.
    # Con '0,30' el cron disparó 2 veces en 24 horas cuando debía hacerlo 26: el
    # robot estuvo casi un día entero muerto sin que nada lo avisara.
    #
    # Aun con minutos poco concurridos GitHub puede retrasar un disparo bastante.
    # Por eso el portero YA NO usa una ventana estrecha: mira si hay una oleada en
    # la próxima hora y cuarto que todavía no se haya analizado. Así un disparo con
    # retraso llega tarde pero LLEGA, en vez de caer fuera de la ventana y perderse.
    # Cuatro intentos por hora en vez de dos: con GitHub descartando ~90% de los
    # disparos, lo unico que se puede hacer es pedir turno mas veces. El portero es
    # gratis (solo consulta la API de MLB), asi que intentarlo de mas no cuesta nada.
    # Basta con que UNO caiga: ese se queda despierto y cubre el resto del dia.
    - cron: '2,17,32,47 14-23 * * *'
    - cron: '2,17,32,47 0-2 * * *'
  workflow_dispatch:
    inputs:
      # UNA lista, no dos casillas. Con dos casillas parecidas es facil marcar la
      # equivocada: marcar "probar_telegram" saltaba TODO el analisis y aun asi el
      # run salia en verde, o sea que parecia que el analisis habia corrido y no.
      modo:
        description: '¿Qué quieres hacer?'
        type: choice
        default: 'analizar-ya'
        options:
          - 'analizar-ya'          # analiza AHORA, sin esperar a la oleada
          - 'solo-si-toca'         # como el cron: solo si hay una oleada en plazo
          - 'probar-telegram'      # solo manda un mensaje de prueba, sin gastar creditos
          - 'avisar-lo-guardado'   # reenvia por Telegram el analisis YA guardado, sin analizar
          - 'ver-chats'            # dice el id de cada chat/grupo donde puede escribir el bot

# Dos corridas a la vez se pisarían escribiendo en Supabase y gastarían el doble.
# La PRUEBA de Telegram va en su propio grupo: si no, se quedaría encolada detrás de
# un job que puede estar durmiendo cinco horas esperando una oleada, y probar un
# mensaje no puede depender de eso.
concurrency:
  group: ${{ (inputs.modo == 'probar-telegram' || inputs.modo == 'avisar-lo-guardado' || inputs.modo == 'ver-chats') && 'prueba-telegram' || 'analisis-auto' }}
  cancel-in-progress: false

jobs:
  analizar:
    runs-on: ubuntu-latest
    # Hasta 5h30. El job puede quedarse ESPERANDO a una oleada futura, porque el cron
    # de GitHub no es de fiar: descarta la mayoria de los disparos. El que si llega se
    # queda despierto y cubre varias oleadas seguidas, en vez de decir "no toca" y
    # morirse dejando el dia sin analizar.
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      # Prueba aislada del aviso. Manda un mensaje de ejemplo y termina: no abre el
      # navegador, no analiza y no gasta un solo credito de The Odds API. Sirve para
      # comprobar TG_TOKEN y TG_CHAT sin pagar ~183 creditos por ver si llega un mensaje.
      # Este paso SI falla si el envio falla: es lo unico que se le pidio.
      - name: Probar Telegram
        if: inputs.modo == 'probar-telegram'
        env:
          TG_TOKEN: ${{ secrets.TG_TOKEN }}
          TG_CHAT:  ${{ secrets.TG_CHAT }}
        run: |
          if [ -z "${TG_TOKEN:-}" ] || [ -z "${TG_CHAT:-}" ]; then
            echo "::error::Faltan los secretos TG_TOKEN y/o TG_CHAT. Creálos en Settings > Secrets and variables > Actions."
            exit 1
          fi
          node bot/avisar.mjs --prueba

      # Reenvia por Telegram el analisis que YA esta guardado en Supabase. No abre
      # el navegador y no gasta creditos: sirve para comprobar el aviso con picks
      # REALES cuando el analisis en si esta dando problemas. Usa el MISMO avisar.mjs
      # que una corrida normal, asi que lo que llega es identico.
      - name: Avisar con lo ya guardado
        if: inputs.modo == 'avisar-lo-guardado'
        env:
          TG_TOKEN: ${{ secrets.TG_TOKEN }}
          TG_CHAT:  ${{ secrets.TG_CHAT }}
        run: |
          node bot/armar-desde-supabase.mjs
          node bot/avisar.mjs

      # Dice a que chats puede escribir el bot y con que id. Existe porque sacar el
      # id de un GRUPO tiene tres trampas: es negativo, el modo privacidad esconde
      # los mensajes normales, y al pasar a supergrupo el id CAMBIA.
      - name: Ver chats de Telegram
        if: inputs.modo == 'ver-chats'
        env:
          TG_TOKEN: ${{ secrets.TG_TOKEN }}
        run: node bot/listar-chats.mjs

      - name: ¿Toca correr?
        if: ${{ inputs.modo != 'probar-telegram' && inputs.modo != 'avisar-lo-guardado' && inputs.modo != 'ver-chats' }}
        id: portero
        run: node bot/toca-correr.mjs

      - name: Instalar Chromium
        if: (steps.portero.outputs.correr == 'true' || inputs.modo == 'analizar-ya') && inputs.modo != 'probar-telegram' && inputs.modo != 'avisar-lo-guardado' && inputs.modo != 'ver-chats'
        run: |
          npm init -y >/dev/null 2>&1
          npm i --no-save playwright@1.47.2
          npx playwright install --with-deps chromium

      # Bucle: analiza la oleada que toca, y despues vuelve a preguntar. Si queda otra
      # oleada mas tarde, espera dormida hasta ella y la analiza tambien. Asi UN disparo
      # puede cubrir toda la tarde. Termina cuando no queda nada o se agota el tiempo.
      - name: Analizar las oleadas del día
        if: (steps.portero.outputs.correr == 'true' || inputs.modo == 'analizar-ya') && inputs.modo != 'probar-telegram' && inputs.modo != 'avisar-lo-guardado' && inputs.modo != 'ver-chats'
        env:
          BOT_EMAIL:    ${{ secrets.BOT_EMAIL }}
          BOT_PASSWORD: ${{ secrets.BOT_PASSWORD }}
          APP_URL:      https://mlb-picks-pro.vercel.app/
          TG_TOKEN:     ${{ secrets.TG_TOKEN }}
          TG_CHAT:      ${{ secrets.TG_CHAT }}
        run: |
          set -u
          LIMITE=$(( $(date +%s) + 300*60 ))   # margen bajo el timeout del job
          DORMIR="${{ steps.portero.outputs.dormir || '0' }}"
          # "analizar-ya" tiene que significar AHORA. Sin esto, un arranque manual heredaba
          # la espera del portero y se quedaba dormido hasta la proxima oleada: el job
          # parecia colgado media hora cuando en realidad estaba haciendo lo correcto,
          # solo que no lo que se le pidio. Despues de este primer analisis el bucle
          # sigue normal y espera a las oleadas que queden.
          if [ "${{ inputs.modo }}" = "analizar-ya" ]; then
            echo "Arranque manual con 'forzar': se analiza YA, sin esperar."
            DORMIR=0
          fi
          VUELTA=0
          while :; do
            VUELTA=$((VUELTA+1))
            if [ "${DORMIR:-0}" -gt 0 ]; then
              if [ $(( $(date +%s) + DORMIR )) -gt "$LIMITE" ]; then
                echo "La espera de $((DORMIR/60)) min no cabe en el tiempo del job. Fin."
                break
              fi
              # AL RESUMEN, no solo al log. Un job dormido se ve EXACTAMENTE igual que
              # uno colgado: el contador sube y no pasa nada. Sin esta línea hay que
              # abrir el paso para enterarse de que está esperando a propósito.
              DESPIERTA=$(TZ=America/New_York date -d "+$((DORMIR/60)) minutes" '+%-I:%M %p' 2>/dev/null || echo '?')
              echo "Vuelta $VUELTA · esperando $((DORMIR/60)) min hasta la oleada…"
              echo "### ⏳ Durmiendo $((DORMIR/60)) min" >> $GITHUB_STEP_SUMMARY
              echo "" >> $GITHUB_STEP_SUMMARY
              echo "No está colgado: espera despierto a la oleada y analiza a las **$DESPIERTA ET**." >> $GITHUB_STEP_SUMMARY
              echo "Para analizar sin esperar, cancela y vuelve a lanzarlo eligiendo \`analizar-ya\`." >> $GITHUB_STEP_SUMMARY
              sleep "$DORMIR"
            fi
            echo "Vuelta $VUELTA · analizando"
            echo "### ▶️ Analizando (vuelta $VUELTA) · $(TZ=America/New_York date '+%-I:%M %p') ET" >> $GITHUB_STEP_SUMMARY
            node bot/correr-analisis.mjs || echo "::warning::El analisis de la vuelta $VUELTA fallo"
            # El aviso va DESPUES de cada analisis, no al final del job: el job puede
            # quedarse dormido horas esperando la siguiente oleada, y un aviso que
            # llega cuatro horas tarde no sirve para apostar nada.
            node bot/avisar.mjs || true
            [ "$(date +%s)" -ge "$LIMITE" ] && { echo "Tiempo agotado. Fin."; break; }
            # ¿queda otra oleada?
            node bot/toca-correr.mjs > /tmp/portero.txt 2>&1 || true
            cat /tmp/portero.txt
            LINEA=$(grep '^RESULTADO' /tmp/portero.txt | tail -1)
            case "$LINEA" in
              *correr=true*) DORMIR=$(echo "$LINEA" | sed -n 's/.*dormir=\([0-9]*\).*/\1/p') ;;
              *) echo "No quedan oleadas. Fin."; break ;;
            esac
          done

      # Si algo falla, la captura dice más que cualquier log.
      - name: Guardar captura del fallo
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fallo-${{ github.run_id }}
          path: bot/fallo.png
          if-no-files-found: ignore
          retention-days: 7

      - name: No tocaba
        if: steps.portero.outputs.correr != 'true' && inputs.modo != 'analizar-ya' && inputs.modo != 'probar-telegram' && inputs.modo != 'avisar-lo-guardado' && inputs.modo != 'ver-chats' && inputs.modo != 'ver-chats'
        run: echo "Sin corrida. ${{ steps.portero.outputs.motivo }}" >> $GITHUB_STEP_SUMMARY
