<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>MLB Picks Pro</title>

<!-- ── App instalable en el teléfono ───────────────────────────────────────── -->
<!-- Con esto, "Añadir a pantalla de inicio" deja un icono propio y la app abre a
     pantalla completa, sin la barra del navegador. En iPhone hay que hacerlo desde
     Safari (Compartir → Añadir a pantalla de inicio); Chrome en iOS no puede. -->
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#07070d">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="MLB Picks">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.6.0/dist/tabler-icons.min.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<style>
:root{
  /* ── Negro futurista · LEDs verde + morado ── */
  --bg:#07070d;--bg2:#0f0f19;--bg3:#161624;--bg4:#212133;
  --text:#eaeaf6;--text2:#9a9ab6;--text3:#61617c;
  --purple:#b26bff;--purple2:#8a3ffc;--pbg:rgba(178,107,255,.13);--ptx:#c99dff;
  --gold:#b26bff;--gold2:#8a3ffc;                       /* marca = LED morado */
  --green:#00e39a;--gbg:rgba(0,227,154,.13);--gtx:#3af0b4;
  --amber:#ffb454;--abg:rgba(255,180,84,.13);--atx:#ffc978;
  --red:#ff5470;--rbg:rgba(255,84,112,.13);--rtx:#ff8098;
  --blue:#7c9dff;--border:rgba(150,140,255,.14);
  --r:12px;--rs:7px;
  --shadow:0 2px 16px rgba(0,0,0,.55);--shadow-lg:0 14px 44px rgba(0,0,0,.7);
  --glow-g:0 0 14px rgba(0,227,154,.5);--glow-p:0 0 14px rgba(178,107,255,.5);
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
@media(prefers-reduced-motion:reduce){html{scroll-behavior:auto}}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:var(--bg);color:var(--text);font-size:13px;min-height:100vh}
a{color:var(--blue);text-decoration:none}
/* ── Layout ── */
#app{display:none;flex-direction:column;height:100vh}
.hdr{display:flex;align-items:center;justify-content:space-between;padding:0 16px;height:48px;background:var(--bg2);border-bottom:1px solid var(--border);flex-shrink:0}
.hdr-left{display:flex;align-items:center;gap:10px}
.logo{width:32px;height:32px;background:var(--gold);border-radius:8px;display:flex;align-items:center;justify-content:center;color:#fff;font-size:16px;flex-shrink:0}
.hdr-title{font-size:14px;font-weight:700}
.hdr-sub{font-size:10px;color:var(--text3);margin-top:1px}
.hdr-right{display:flex;align-items:center;gap:8px}
.badge{font-size:10px;padding:3px 8px;border-radius:4px;background:var(--bg3);color:var(--text2)}
.badge.connected{background:var(--gbg);color:var(--gtx)}
.vs{font-size:13px;color:var(--text3);text-align:center}
/* ── Pick rows ── */
.picks{border-top:1px solid var(--border)}
@media(max-width:520px){.f5-grid{grid-template-columns:repeat(2,1fr)}}
.med  .pick-accent,.med  .pick-badge{background:var(--abg)}
.med  .label,.med  .pick-prob{color:var(--atx)}
.er-app .n{font-family:ui-monospace,Consolas,monospace;font-weight:800;opacity:.7}
.er-note.red{color:var(--red)}
.board-hd .t{font-size:11px;font-weight:800;letter-spacing:.5px;color:var(--gold)}
.board-hd .s{font-size:10px;color:var(--text3)}
.sig-rec .r{font-size:18px;font-weight:800;font-variant-numeric:tabular-nums;letter-spacing:.5px}
.sig-rec .p{font-size:11px;font-weight:700}
.sig-rec .a{font-size:10px;color:var(--text3);font-weight:500}
@media(max-width:560px){
  .board-row{grid-template-columns:88px 1fr 52px;gap:8px}
  .board-tier,.board-dq{display:none}
  .er-row{grid-template-columns:64px 1fr 42px}
}
.bt-chip.warn{color:var(--rtx)}
@media(max-width:560px){ .pod-blks{width:100%} .pod-blk{flex:1} }
input[type=date]{background:var(--bg2);border:1px solid var(--border);border-radius:var(--rs);padding:7px 10px;font-size:12px;color:var(--text);font-family:inherit;outline:none}
.btn{background:var(--gold);color:#fff;border:none;padding:8px 16px;border-radius:var(--rs);font-size:12px;font-weight:700;cursor:pointer;font-family:inherit;display:flex;align-items:center;gap:5px}
.btn:hover{background:var(--gold2)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn-sm{background:var(--bg3);color:var(--text2);border:1px solid var(--border);padding:6px 12px;border-radius:var(--rs);font-size:11px;font-weight:600;cursor:pointer;font-family:inherit}
.btn-sm:hover{background:var(--bg4)}
/* Alineación de columnas: .c = centrada, .r = derecha. Se aplica a th y td por igual
   para que la cabecera nunca quede desfasada respecto a sus celdas. */
.htable th.c,.htable td.c{text-align:center}
.htable th.r,.htable td.r{text-align:right}
.conf-pill{font-size:10px;padding:2px 7px;border-radius:4px;font-weight:600}
.conf-High{background:var(--gbg);color:var(--gtx)}
.conf-Medium{background:var(--abg);color:var(--atx)}
.conf-Low{background:var(--bg3);color:var(--text2)}
.mark-btn{font-size:10px;padding:3px 8px;border-radius:4px;border:1px solid var(--border);background:transparent;cursor:pointer;font-family:inherit;color:var(--text2)}
.mark-btn.push{background:#e6eefb;color:#2f72c4;border-color:var(--blue)}
input[type=range]{width:100%;accent-color:var(--gold)}
@keyframes spin{to{transform:rotate(360deg)}}
/* ── Pulido visual · negro futurista con LEDs ── */
body{background:radial-gradient(1100px 560px at 15% -10%,rgba(178,107,255,.10),transparent),radial-gradient(1000px 520px at 92% 0%,rgba(0,227,154,.08),transparent),var(--bg) fixed}
.hdr{background:linear-gradient(120deg,#0d0d18,#12121f);border-bottom:1px solid var(--border);box-shadow:0 1px 0 rgba(178,107,255,.18),0 4px 22px rgba(0,0,0,.5);height:54px}
.hdr-title{font-size:15px;font-weight:800;letter-spacing:.3px;background:linear-gradient(90deg,var(--purple),var(--green));-webkit-background-clip:text;background-clip:text;color:transparent}
.logo{background:linear-gradient(135deg,var(--purple),var(--purple2));box-shadow:0 0 18px rgba(178,107,255,.6),inset 0 0 8px rgba(255,255,255,.15);width:34px;height:34px}
.btn{background:linear-gradient(135deg,var(--purple),var(--purple2));box-shadow:0 0 16px rgba(178,107,255,.42);transition:filter .12s,transform .1s}
.btn:hover{filter:brightness(1.14)}
.btn:active{transform:translateY(1px)}
.vs{font-size:11px;font-weight:700;opacity:.5;align-self:center}
.badge.connected{box-shadow:0 0 10px rgba(0,227,154,.4)}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-thumb{background:#2a2a3d;border-radius:8px;border:2px solid var(--bg)}
::-webkit-scrollbar-track{background:transparent}
/* ── Layout: aprovechar todo el ancho en PC (2 columnas de tarjetas) ── */
@media(min-width:1080px){
  #picks-area,#pitchers-area{display:grid;grid-template-columns:1fr 1fr;gap:14px;align-items:start}
  #picks-area>.card,#pitchers-area>.card{margin-bottom:0}
  /* Los avisos y notas van a ancho completo: como hijos directos del grid ocupaban
     una celda y dejaban un hueco al lado de la primera tarjeta. */
  #picks-area>.empty,#pitchers-area>.empty,
  #picks-area>.area-note,#pitchers-area>.area-note,
  #picks-area>.board,#pitchers-area>.board,
  #picks-area>.full-w,#pitchers-area>.full-w,
  #picks-area>.error-box,#pitchers-area>.error-box{grid-column:1/-1}
}
@media(min-width:1500px){
  #picks-area,#pitchers-area{grid-template-columns:1fr 1fr 1fr}
}
/* ── Responsive móvil ── */
@media(max-width:640px){
  .tab-pane{padding:10px}
  .team-name{font-size:21px}
  .team-logo-img{width:40px;height:40px}
  .stats-bar{grid-template-columns:repeat(2,1fr)}
  .toolbar #odds-key{min-width:140px;flex:1}
  .htable th,.htable td{padding:6px 7px}
  .pick-badge{width:60px}
}

/* ── Selector de deporte (lo llena el núcleo) ── */
.sport-switch{display:inline-flex;background:var(--bg3);border:1px solid var(--border);border-radius:99px;padding:2px;gap:2px}
.sport-btn{border:none;background:none;font-family:inherit;font-size:12px;font-weight:700;color:var(--text2);padding:5px 12px;border-radius:99px;cursor:pointer;white-space:nowrap}
.sport-btn.active{background:var(--gold);color:#fff}
.sport-btn:hover:not(.active){color:var(--text)}
</style>
</head>
<body>

<div id="app">
  <!-- Header -->
  <div class="hdr">
    <div class="hdr-left">
      <div class="logo"><i class="ti ti-trophy"></i></div>
      <div>
        <div class="hdr-title">MLB Picks Pro</div>
        <div class="hdr-sub">MLB Stats API · Supabase · Modelo estadístico</div>
      </div>
    </div>
    <div class="hdr-right">
      <div id="sport-switch" class="sport-switch" style="display:none"></div>
      <span id="cloud-badge" class="badge">Conectando...</span>
      <span id="hdr-date" class="badge"></span>
      <button id="auth-btn" class="btn-sm" onclick="toggleAuth()"><i class="ti ti-lock"></i> <span id="auth-label">Entrar</span></button>
    </div>
  </div>

  <!-- Login (dueño) -->

  <div id="login-modal" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:50;align-items:center;justify-content:center">
    <div style="background:var(--bg2);border:1px solid var(--border);border-radius:var(--r);padding:20px;width:300px;max-width:90vw">
      <div style="font-size:14px;font-weight:700;margin-bottom:4px">🔒 Acceso del dueño</div>
      <div style="font-size:11px;color:var(--text2);margin-bottom:14px">Solo necesario para generar, guardar y calificar. Ver es libre.</div>
      <input id="login-email" type="email" placeholder="Email" autocomplete="username"
        style="width:100%;background:var(--bg3);border:1px solid var(--border);border-radius:var(--rs);padding:9px 11px;font-size:13px;color:var(--text);font-family:inherit;outline:none;margin-bottom:8px">
      <input id="login-pass" type="password" placeholder="Contraseña" autocomplete="current-password"
        style="width:100%;background:var(--bg3);border:1px solid var(--border);border-radius:var(--rs);padding:9px 11px;font-size:13px;color:var(--text);font-family:inherit;outline:none;margin-bottom:8px"
        onkeydown="if(event.key==='Enter')doLogin()">
      <div id="login-err" style="font-size:11px;color:var(--rtx);margin-bottom:8px;min-height:14px"></div>
      <div style="display:flex;gap:8px">
        <button class="btn" style="flex:1;justify-content:center" onclick="doLogin()"><i class="ti ti-login"></i>Entrar</button>
        <button class="btn-sm" onclick="$('login-modal').style.display='none'">Cancelar</button>
      </div>
    </div>
  </div>


  <!-- Cada deporte mete aquí su propio contenedor. index.html no sabe cuáles hay. -->
  <div id="deportes"></div>
</div>


<!-- Núcleo primero; después cada deporte. Añadir uno = una línea más. -->
<script src="core.js"></script>
<script src="deportes/mlb.js"></script>
</body>
</html>
